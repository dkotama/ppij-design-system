name: Design system checks and Storybook preview

on:
  push:
    branches: [main, redesign-v1]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ds-pages
  cancel-in-progress: false

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Story coverage and token parity
        run: npm test
      - name: Type check
        run: npm run lint
      - name: Build package and Storybook
        run: npm run build
      - name: Build redesign prototype and place it under /redesign-v1
        if: github.ref == 'refs/heads/redesign-v1'
        run: |
          npm run build -w ppij-redesign-v1
          mkdir -p storybook-static/redesign-v1
          cp -r prototypes/redesign-v1/dist/. storybook-static/redesign-v1/
      - name: Upload Storybook to Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static
  deploy:
    if: github.event_name == 'push'
    needs: check-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
